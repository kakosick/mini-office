<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini-office</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
<h1>Mini office</h1>
<div id="hud">
<span class="pill">Задач: <b id="sc">0</b></span>
<span class="pill">Усталость <span class="bar"><i id="fat" style="display:block"></i></span></span>
<span class="pill">Время <b id="tm">09:00</b></span>
<span class="pill">Рекорд аркады: <b id="best">0</b></span>
<span class="pill">Монеты: <b id="coins">0</b></span>
<span id="note"></span>
</div>
<p id="rot">📱 Поверни телефон горизонтально — играть так удобнее.</p>
<canvas id="g" width="800" height="480"></canvas>
<p id="help">WASD или стрелки — ходить. E — действие: стол, аркада, кофе, диван или разговор с коллегой. Esc — выйти.</p>
<div id="pad"><div class="dp"><button data-k="ArrowUp" aria-label="Вверх">▲</button><button data-k="ArrowLeft" aria-label="Влево">◀</button><button data-k="ArrowDown" aria-label="Вниз">▼</button><button data-k="ArrowRight" aria-label="Вправо">▶</button></div><div class="ab"><button id="be">E</button><button id="bx" class="g">Esc</button></div></div>
<div id="task" class="ov">
<b>Задача</b>
<p id="tq"></p>
<input id="ta" autocomplete="off" aria-label="Ответ">
<p id="tf"></p>
<div class="row"><button id="tb">Ответить</button><button id="th" class="g">Подсказка</button><button id="tc" class="g">Отмена</button></div>
</div>
<div id="chat" class="ov">
<div class="row" style="justify-content:space-between;align-items:center"><b id="cn"></b><span><button class="g" id="vo" aria-label="Голос коллег">🔊</button> <button class="g" id="cx" aria-label="Закрыть чат">✕</button></span></div>
<div id="log"></div>
<div id="qr"></div>
<button id="mic">🎤 Говорить</button>
<div class="row"><input id="ci" autocomplete="off" placeholder="Или напиши, если нужно…" aria-label="Сообщение"><button id="cs">Отправить</button></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
